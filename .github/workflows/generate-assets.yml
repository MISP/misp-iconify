name: Generate Assets

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Makefile"
      - "package.json"
      - "package-lock.json"

jobs:
  generate-assets:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system tooling
        run: sudo apt-get update && sudo apt-get install -y imagemagick librsvg2-bin inkscape libxml2-utils

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install font tooling
        run: npm ci

      - name: Generate raster assets
        run: make assets

      - name: Generate webfont
        run: make font

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add exports metadata/codepoints.json

          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi

          git commit -m "chore: generate icon assets [skip ci]"
          git push
